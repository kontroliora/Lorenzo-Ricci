# Health checks + Meta ads data every 15 minutes (GitHub delays scheduled runs, so a strict hourly slot would be missed) (the Vercel Hobby plan allows only daily crons; vercel.json also pulls
# Meta once a day). Same secret as stripe-reconcile.yml: RECONCILE_SECRET (Settings -> Secrets and variables -> Actions), equal to
# RECONCILE_SECRET in Vercel. Without it the job does nothing.
# Optional TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID secrets here too: then a site that does not answer at all (so it cannot alert by
# itself) is still reported from GitHub.
name: health
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Meta ads sync (yesterday + today, before the checks so "spent > 15 EUR today" is fresh)
        env:
          RECONCILE_SECRET: ${{ secrets.RECONCILE_SECRET }}
        run: |
          if [ -z "$RECONCILE_SECRET" ]; then echo "RECONCILE_SECRET is not set - skipping"; exit 0; fi
          code=$(curl -s -o meta.json -w "%{http_code}" --max-time 90 -H "Authorization: Bearer $RECONCILE_SECRET" "https://www.lorenzo-ricci.com/api/cron/meta-ads?days=2")
          echo "HTTP $code"; cat meta.json; echo
      - name: Health checks
        env:
          RECONCILE_SECRET: ${{ secrets.RECONCILE_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$RECONCILE_SECRET" ]; then echo "RECONCILE_SECRET is not set - skipping"; exit 0; fi
          code=$(curl -s -o out.json -w "%{http_code}" --max-time 90 -H "Authorization: Bearer $RECONCILE_SECRET" https://www.lorenzo-ricci.com/api/cron/health || echo 000)
          echo "HTTP $code"; cat out.json; echo
          if [ "$code" != "200" ] && [ "$code" != "401" ] && [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s --max-time 20 "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=🔴 Lorenzo Ricci: проверката на системата не отговаря (HTTP $code). Сайтът може да е паднал." > /dev/null
          fi
          [ "$code" = "200" ]
