# Outside watchdog. The 15-minute checks + Meta sync run on Vercel Cron (vercel.json -> /api/cron/health); if the whole site is down,
# that cron cannot alert, so this job pings the endpoint from GitHub and sends Telegram itself when it does not answer.
# GitHub delays scheduled jobs (in practice every few hours), so this is a backstop, not the main check.
# Secrets (Settings -> Secrets and variables -> Actions): RECONCILE_SECRET (= Vercel's), TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
# Without RECONCILE_SECRET the job does nothing.
name: health-watchdog
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health endpoint
        env:
          RECONCILE_SECRET: ${{ secrets.RECONCILE_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$RECONCILE_SECRET" ]; then echo "RECONCILE_SECRET is not set - skipping"; exit 0; fi
          code=$(curl -s -o out.json -w "%{http_code}" --max-time 30 -H "Authorization: Bearer $RECONCILE_SECRET" "https://www.lorenzo-ricci.com/api/cron/health?ping=1" || echo 000)
          echo "HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "401" ] && [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s --max-time 20 "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=🔴 Lorenzo Ricci: сайтът не отговаря (HTTP $code). Проверката от Vercel също не може да алармира." > /dev/null
          fi
          [ "$code" = "200" ]
